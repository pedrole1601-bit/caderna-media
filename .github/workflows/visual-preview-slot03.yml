name: CADERNA one-time visual preview slot 03
on:
  push:
    paths:
      - '.github/workflows/visual-preview-slot03.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Print compact thumbnail for independent editorial inspection
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from io import BytesIO
          import base64
          p=Path('media/auto/2026-11-04-copom-decide-selic-apos-cinco-cortes-01.jpg')
          assert p.is_file()
          im=Image.open(p).convert('RGB')
          im.thumbnail((320,400))
          buf=BytesIO()
          im.save(buf,format='JPEG',quality=58,optimize=True)
          print('CADERNA_THUMB_BEGIN')
          print(base64.b64encode(buf.getvalue()).decode())
          print('CADERNA_THUMB_END')
          PY
