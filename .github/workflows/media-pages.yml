name: CADERNA — arte 001 v0.7 + QA visual + GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_enem_001.py'
      - 'scripts/verify_design_qa.py'
      - 'tests/test_visual_qa.py'
      - 'assets/logo-horizontal-inverse-v01.svg'
      - 'index.html'
      - '.github/workflows/media-pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: caderna-media-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar tipografia livre e renderização SVG/Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-inter fonts-lato
          fc-list | grep -E 'Noto Sans Display|Noto Serif Display|Inter Display' | head -12 || true
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'CairoSVG>=2.7,<3'
      - name: Gate 01 — render com identidade canônica e caixas verificadas
        env:
          CADERNA_OUTPUT_DIR: media
        run: python scripts/render_enem_001.py
      - name: Gate 02 — hierarquia, margens, contraste básico e tamanho móvel
        run: python scripts/verify_design_qa.py
      - name: Gate 03 — testes negativos (colisão/hierarquia/legenda)
        run: python -m unittest discover -s tests -p 'test_visual_qa.py' -v
      - name: Gate 04 — skill e guia de revisão obrigatórios
        run: |
          test -f .agents/skills/caderna-editorial-design/SKILL.md
          test -f docs/CRITICA-EDITORIAL-001-v07.md
          grep -q 'DESIGN_QA_PASS_TECHNICAL_ONLY' docs/CRITICA-EDITORIAL-001-v07.md
          grep -q 'Ainda não publicado no Instagram' docs/CRITICA-EDITORIAL-001-v07.md
      - name: Salvar arquivos raster corrigidos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/caderna-enem-2026-001-v2*
          if ! git diff --cached --quiet; then
            git commit -m "media(v0.7): versão corrigida capa ENEM com relatório QA"
            git pull --rebase
            git push
          fi
      - name: Preparar acervo público sem fontes internos e sem credenciais
        run: |
          mkdir -p site/media
          cp index.html site/index.html
          cp media/caderna-enem-2026-001-v2.jpg site/media/
          cp media/caderna-enem-2026-001-v2.png site/media/
          cp media/caderna-enem-2026-001-v2-mobile.png site/media/
          touch site/.nojekyll
      - name: Configurar GitHub Pages já ativado
        uses: actions/configure-pages@v5
      - name: Publicar somente o site e as mídias no Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy da mídia no Pages (NÃO Instagram)
        id: deployment
        uses: actions/deploy-pages@v4
      - name: QA preview disponível como artifact
        uses: actions/upload-artifact@v4
        with:
          name: caderna-enem-001-qa-v07
          path: |
            media/caderna-enem-2026-001-v2.png
            media/caderna-enem-2026-001-v2-mobile.png
            media/caderna-enem-2026-001-v2-qa.json
          if-no-files-found: error
# NOTE: website hosting only. Never invoke the Instagram publisher from this repo.
