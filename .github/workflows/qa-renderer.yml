name: CADERNA — QA do renderizador todas editorias
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_editorial.py'
      - 'tests/test_render_editorial.py'
      - '.github/workflows/qa-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar as fontes e ferramentas livres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-inter fonts-lato
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'CairoSVG>=2.7,<3'
      - name: Testes reais de 1/4 cards, alto impacto, dados e margens
        run: |
          python -m unittest discover -s tests -p test_render_editorial.py -v
          python -m py_compile scripts/render_editorial.py
# No secrets, no Instagram API access, no media publication in this QA workflow.
